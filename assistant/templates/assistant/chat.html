<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POWR AI - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; }
        .nav-link { color: #fff; font-size: 14px; font-weight: 500; }
        .nav-link:hover { opacity: 0.7; }
        .btn-outline { border: 1px solid #fff; color: #fff; padding: 10px 24px; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .btn-outline:hover { background: #fff; color: #000; }
        .msg-user { background: #fff; color: #000; }
        .msg-bot { background: #1a1a1a; color: #fff; }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen text-white">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <a href="{% url 'dashboard' %}" class="text-white">
                <svg width="120" height="32" viewBox="0 0 120 32" fill="none"><text x="0" y="24" fill="white" font-family="Inter" font-weight="700" font-size="24" font-style="italic">POWR</text></svg>
            </a>
            <div class="flex items-center gap-10">
                <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
                <a href="{% url 'chat_history' %}" class="nav-link">History</a>
                <a href="{% url 'leads' %}" class="nav-link">Leads</a>
                <a href="{% url 'chat' %}" class="nav-link">Chat</a>
            </div>
            <a href="{% url 'dashboard' %}" class="btn-outline">→ VIEW STATS</a>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-8">
        <div class="max-w-3xl mx-auto">
            <div class="text-center mb-12">
                <h1 class="text-5xl font-bold mb-4">Chat Simulator</h1>
                <p class="text-gray-500">Test the AI Assistant in real-time</p>
            </div>

            <div class="bg-[#0a0a0a] border border-[#1a1a1a] rounded-2xl overflow-hidden">
                <div class="border-b border-[#1a1a1a] px-6 py-4 flex items-center gap-4">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center"><span class="text-black font-bold text-sm">P</span></div>
                    <div>
                        <p class="font-semibold">POWR AI Assistant</p>
                        <p class="text-green-500 text-xs flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Online</p>
                    </div>
                </div>
                <div id="chat-box" class="h-[450px] overflow-y-auto p-6 space-y-4">
                    <div class="flex justify-start">
                        <div class="msg-bot rounded-2xl rounded-bl-sm px-4 py-3 max-w-[80%]">
                            <p class="text-sm">مرحباً! 👋 أنا مساعد POWR الذكي. كيف يمكنني مساعدتك؟</p>
                        </div>
                    </div>
                </div>
                <div class="border-t border-[#1a1a1a] p-4">
                    <form id="chat-form" class="flex gap-3">
                        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-[#111] border border-[#222] rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#444] text-white placeholder-gray-600">
                        <button type="submit" class="btn-outline px-6">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script>
        const box = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('msg-input');
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function addMsg(txt, isUser) {
            const w = document.createElement('div');
            w.className = 'flex ' + (isUser ? 'justify-end' : 'justify-start');
            w.innerHTML = '<div class="' + (isUser ? 'msg-user rounded-br-sm' : 'msg-bot rounded-bl-sm') + ' rounded-2xl px-4 py-3 max-w-[80%]"><p class="text-sm whitespace-pre-wrap">' + esc(txt) + '</p></div>';
            box.appendChild(w); box.scrollTop = box.scrollHeight;
        }
        function typing(show) {
            let el = document.getElementById('typing-el');
            if (show && !el) {
                const w = document.createElement('div'); w.id = 'typing-el'; w.className = 'flex justify-start';
                w.innerHTML = '<div class="msg-bot rounded-2xl rounded-bl-sm px-4 py-3"><p class="text-sm text-gray-500">Typing...</p></div>';
                box.appendChild(w); box.scrollTop = box.scrollHeight;
            } else if (!show && el) { el.remove(); }
        }
        form.onsubmit = async (e) => {
            e.preventDefault(); const txt = input.value.trim(); if (!txt) return;
            addMsg(txt, true); input.value = ''; typing(true);
            try {
                const r = await fetch('/api/chat/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: txt }) });
                const d = await r.json(); typing(false); addMsg(d.reply || d.error || 'Error', false);
            } catch (err) { typing(false); addMsg('Connection error', false); }
        };
    </script>
</body>
</html>
